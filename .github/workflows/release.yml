name: Release npm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
      queue: max
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  dispatch:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start publishing from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          release_run_url=$(gh api --method POST -H "X-GitHub-Api-Version: 2026-03-10" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            --field "ref=$RELEASE_TAG" --field return_run_details=true --jq '.html_url')
          printf 'Publish workflow: %s\n' "$release_run_url" >> "$GITHUB_STEP_SUMMARY"
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate the release tag and source commit
        id: release
        run: node scripts/release.ts validate
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      full-check: true
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-beta-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: package-node-24
          path: artifacts
      - name: Check the tarball and registry state
        id: package
        run: node scripts/release.ts check artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish npm with OIDC
        if: steps.package.outputs.publish == 'true'
        run: npm publish "$RELEASE_TARBALL" --access public --tag latest --provenance --ignore-scripts
        env:
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
          NODE_AUTH_TOKEN: ''
