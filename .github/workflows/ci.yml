name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - 'docs/**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full-check:
        description: Run all checks regardless of changed paths
        type: boolean
        required: false
        default: false
      ref:
        description: Commit to verify and package
        type: string
        required: false
        default: ''
concurrency:
  # Re-runs of old commits must not cancel CI for the current PR head.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Decide whether tests are needed
        id: changes
        run: node scripts/ci-changes.ts
        env:
          CI_FULL_CHECK: ${{ inputs.full-check || false }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
  check:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # prepack builds dist for both the default tests and the tarball.
      - run: pnpm pack --pack-destination ./artifacts
      - run: pnpm exec vitest run --project default
      - run: pnpm test:package
        env:
          WORKLOAD_PACKAGE_ARTIFACTS: ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
  kubernetes:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: helm/kind-action@v1
        with:
          cluster_name: varlock-workload
          version: v0.33.0
      - run: pnpm test:cluster
        env:
          WORKLOAD_TEST_CONTEXT: kind-varlock-workload
  result:
    name: CI result
    if: always()
    needs: [changes, check, kubernetes]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          CHECK_RESULT: ${{ needs.check.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          if [[ "$RUN_TESTS" == true ]]; then
            [[ "$CHECK_RESULT" == success && "$KUBERNETES_RESULT" == success ]]
          else
            [[ "$RUN_TESTS" == false && "$CHECK_RESULT" == skipped && "$KUBERNETES_RESULT" == skipped ]]
          fi
