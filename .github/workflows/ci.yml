name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm pack --pack-destination ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: helm/kind-action@v1
        with:
          cluster_name: varlock-workload
          version: v0.33.0
      - run: pnpm test:cluster
        env:
          WORKLOAD_TEST_CONTEXT: kind-varlock-workload
